name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  WASIXCC_VERSION: v0.4.3

jobs:
  check:
    name: Generated files, formatting, lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the window system's development files
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev
      - run: make check

  native:
    name: Native host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GPU on the Linux runners: Mesa's software Vulkan stands in.
          - os: ubuntu-24.04
            fallback_adapter: "1"
          - os: macos-15
            fallback_adapter: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Install wasixcc
        uses: wasix-org/wasixcc@v0.4.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.WASIXCC_VERSION }}
      - name: Build the guest library, the conformance programs and the examples
        run: make programs examples
      - name: Test
        env:
          WEBGPU_TEST_FALLBACK_ADAPTER: ${{ matrix.fallback_adapter }}
        run: make test-native

  browser:
    name: Browser host (Chrome)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install wasixcc
        uses: wasix-org/wasixcc@v0.4.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.WASIXCC_VERSION }}
      - name: Test
        run: make test-browser
